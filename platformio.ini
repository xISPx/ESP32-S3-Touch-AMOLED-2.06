; =============================================================
;  Waveshare ESP32-S3-Touch-AMOLED-2.06 — Smartwatch prototype
;  PlatformIO / Arduino framework (arduino-esp32 core 3.2.x)
; =============================================================
[env:esp32s3-amoled-watch]
; pioarduino fork is required: the stock espressif32 platform is
; stuck on arduino-esp32 2.x, but the Waveshare board stack
; (GFX Library 1.6.0 + LVGL 9.3 + SensorLib) needs core >= 3.2.0.
;
; 54.03.21-2 = Arduino core 3.2.1 (unchanged) + esptool 5.0.2.
; Plain 54.03.21 ships esptool 5.0.0-dev1, which crashes at import
; ("TypeError: ParamType.get_metavar() missing ... 'ctx'") on
; click >= 8.2 — e.g. in the PlatformIO IDE venv (VS Code), where
; bootloader.bin generation fails. esptool 5.0.2 carries the
; compatibility shim, so both CLI and IDE builds work.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
; The platform's tool-esptoolpy entry is a meta-package that must be expanded
; by an idf_tools.py bootstrap, which can silently fail on some setups (e.g.
; PlatformIO 6.2.x runs it under a bare python without its requirements) —
; then esptool.py is missing and "bootloader.bin" fails. Pin the real
; esptool 5.0.2 package instead: it downloads as-is, keeps esptool.py at the
; package root and carries the Click >= 8.2 compatibility shim.
platform_packages = tool-esptoolpy@https://github.com/pioarduino/esptool/releases/download/v5.0.2/esptool.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM geometry of the Waveshare board -------------
; 16 MB QSPI flash + 8 MB octal PSRAM (embedded in the S3R8)
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 32MB
board_build.partitions = partitions_32mb.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
    ; lv_conf.h lives in include/ — expose it to library builds (LVGL)
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    moononournation/GFX Library for Arduino@1.6.0
    lvgl/lvgl@9.3.0
    lewisxhe/SensorLib@0.3.1
    lewisxhe/XPowersLib@0.2.6
    bblanchon/ArduinoJson@^7.0.4
    links2004/WebSockets@^2.3.7
    https://github.com/pschatzmann/arduino-libopus.git

; GUI tests are optional and slow down the build
check_skip_packages = yes
